name: "[Job] Remove ingress"

on:
  workflow_call:
    inputs:
      environment_config_json:
        description: "Environment config JSON"
        required: true
        type: string
      ingress_management_oidc_role_arn:
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  remove_ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c # v1
        name: Run Against Image/aws-cli-action
      - name: Manage Ingress/Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.ingress_management_oidc_role_arn }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          role-session-name: OPGModernisingLPATerraformGithubAction
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: remove_ingress
        run: |
          pip install -r ./scripts/ci_ingress/requirements.txt
          python ./scripts/ci_ingress/ci_ingress.py ${{ inputs.environment_config_json }}
